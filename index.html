<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartão Chevalier — Crediário digital da rede</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4F2;--ink:#151515;--mut:#6B6560;--rio:#D9480F;--sol:#FF8A1F;--card:#fff;--line:#E0DAD4;--ok:#1E8E5A;--bad:#C2432F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E0E;--ink:#F5F1EC;--mut:#A8A29B;--card:#1A1A1A;--line:#333;--ok:#4CC38A;--bad:#F0806D}}
:root[data-theme="dark"]{--bg:#0E0E0E;--ink:#F5F1EC;--mut:#A8A29B;--card:#1A1A1A;--line:#333;--ok:#4CC38A;--bad:#F0806D}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 'Source Sans 3',system-ui,sans-serif}
h1,h2,h3,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.01em}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 5vw;background:#000;color:#fff;border-bottom:3px solid var(--sol)}
header b{font:800 20px 'Bricolage Grotesque',sans-serif;color:var(--sol)}
header small{color:#BDB6AE}
nav{display:flex;gap:6px;padding:10px 5vw;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1;font-weight:600;font-size:15px;font-family:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
nav button.on{background:var(--rio);color:#fff;border-color:var(--rio)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
main{padding:18px 5vw 40px;max-width:1100px;margin:auto}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.k span{color:var(--mut);font-size:14px;display:block}
.k .big{font-size:26px;font-weight:800}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h3{font-size:18px;margin-bottom:10px}
select,input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
label{font-size:14px;color:var(--mut);display:block;margin:8px 0 3px}
.btn{font-weight:600;font-size:15px;font-family:inherit;border:0;border-radius:8px;padding:10px 16px;background:var(--rio);color:#fff;cursor:pointer}
.btn.s{padding:6px 12px;font-size:14px}.btn.g{background:#25A55A}.btn.o{background:var(--sol);color:#111}
.cc{border-radius:16px;padding:22px;color:#fff;background:linear-gradient(135deg,#2B2B2B,#000);max-width:400px;aspect-ratio:1.6;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.chip{width:42px;height:30px;border-radius:6px;background:linear-gradient(135deg,#F3CF6E,#C99A22)}
.cc .n{font:600 20px 'Bricolage Grotesque',sans-serif;letter-spacing:.12em}
.cc small{opacity:.8}.cc b{color:var(--sol)}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--sol)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li small{color:var(--mut);display:block}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600}
.tag{padding:2px 8px;border-radius:10px;font-size:13px;font-weight:600;background:rgba(30,142,90,.15);color:var(--ok)}
.tag.b{background:rgba(194,67,47,.15);color:var(--bad)}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
#t.on{opacity:1}
.note{color:var(--mut);font-size:14px;margin-top:20px}
</style>
</head>
<body>
<header><div><b>Cartão Chevalier</b><br><small>Crediário digital da rede · Paulo Afonso e região</small></div><button class="btn s o" onclick="reset()">Reiniciar demo</button></header>
<nav><button data-v="c" class="on">Cliente</button><button data-v="l">Lojista</button><button data-v="r">Rede</button><button data-v="a">Cadastro</button></nav>
<main id="m"></main>
<div id="t" role="status"></div>
<script>
const $=s=>document.querySelector(s),R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),D=864e5,K='chev_cc_v1';
const cats=['Moda Feminina','Calçados','Material de Construção','Farmácia','Ótica','Móveis','Eletro','Papelaria','Celulares','Cama e Banho'],suf=['Central','do Sertão','Popular','Real','Nordeste'];
const nomes=['Maria das Graças','João Batista','Ana Paula','José Carlos','Luciene Souza','Edvaldo Lima','Rosângela Dias','Marcos Vinícius','Josefa Alves','Antônio Neto','Cláudia Reis','Francisco Silva','Eliane Costa','Pedro Henrique'];
let S,view='c',cu=0,lj=0,q='',pend='';
const emp=x=>`<div class="panel"><h3>Nada cadastrado ainda</h3><p style="color:var(--mut)">Cadastre ${x} na aba Cadastro para começar.</p></div>`,wn=t=>{t=(t||'').replace(/\D/g,'');return t?(t.length<=11?'55'+t:t):''};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function mk(){let sd=11;const r=()=>(sd=sd*16807%2147483647)/2147483647,now=Date.now();
 const st=[];cats.forEach(c=>suf.forEach(s=>st.push({n:c.split(' ')[0]+' '+s,c})));
 const cl=nomes.map((n,i)=>({n,l:[800,1200,1500,2000,2500][i%5],sc:540+Math.floor(r()*260),rk:i%5===4?.45:.08,no:String(1000+i*137).padStart(4,'0')+' '+String(3300+i*91)}));
 const sa=[];st.forEach((s,si)=>{const k=3+Math.floor(r()*4);for(let j=0;j<k;j++){const ci=Math.floor(r()*cl.length),t=Math.round((80+r()*1200)/10)*10,n=1+Math.floor(r()*8),d=now-Math.floor(r()*150)*D;
  const p=Array.from({length:n},(_,x)=>{const due=d+(x+1)*30*D;return due<now?r()>cl[ci].rk:false});sa.push({s:si,c:ci,t,n,d,p})}});
 return{st,cl,sa}}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.st)S=mk()}
function reset(){try{localStorage.removeItem(K)}catch(e){}S=mk();toast('Demonstração reiniciada');draw()}
const ins=s=>s.p.map((p,k)=>({k,p,due:s.d+(k+1)*30*D,a:s.t/s.n,late:!p&&s.d+(k+1)*30*D<Date.now()}));
function cs(ci){let open=0,late=0;S.sa.forEach(s=>{if(s.c!==ci)return;ins(s).forEach(i=>{if(!i.p){open+=i.a;if(i.late)late++}})});
 const c=S.cl[ci],sc=Math.max(200,Math.min(900,c.sc-25*late)),lim=Math.round(c.l*Math.max(.4,Math.min(1.3,sc/600))/50)*50;return{open,late,sc,lim,av:Math.max(0,lim-open)}}
function ss(si){let tot=0,rec=0,atr=0,v=0;S.sa.forEach(s=>{if(s.s!==si)return;v++;tot+=s.t;ins(s).forEach(i=>{if(!i.p){rec+=i.a;if(i.late)atr+=i.a}})});return{tot,rec,atr,v}}
function toast(m){const t=$('#t');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),2600)}
const dt=x=>new Date(x).toLocaleDateString('pt-BR');
function vC(){if(!S.cl.length)return emp('clientes');const c=S.cl[cu],k=cs(cu),ls=[];S.sa.forEach((s,si)=>{if(s.c===cu)ins(s).forEach(i=>{if(!i.p)ls.push({...i,si,s})})});ls.sort((a,b)=>a.due-b.due);
 return`<div class="panel"><label>Cliente (demonstração)</label><select onchange="cu=+this.value;draw()">${S.cl.map((x,i)=>`<option value="${i}"${i===cu?' selected':''}>${x.n}</option>`).join('')}</select></div>
 <div class="two"><div><div class="cc"><div style="display:flex;justify-content:space-between"><b>Chevalier</b><div class="chip"></div></div><div class="n">${c.no}</div><div style="display:flex;justify-content:space-between"><div><small>Titular</small><br>${c.n}</div><div><small>Score</small><br><b>${k.sc}</b></div></div></div></div>
 <div class="panel"><h3>Seu limite</h3><div class="big" style="font-size:30px;font-weight:800">${R(k.av)}</div><small style="color:var(--mut)">disponível de ${R(k.lim)}</small><div class="bar"><i style="width:${Math.min(100,k.open/k.lim*100)}%"></i></div>
 <p style="color:var(--mut);font-size:14px">${k.late?`<span class="bad">${k.late} parcela(s) atrasada(s) reduzem seu score.</span> Pague para recuperar o limite.`:'Pagando em dia, seu limite aumenta em todas as lojas da rede.'}</p></div></div>
 <div class="panel"><h3>Minhas parcelas</h3>${ls.length?ls.slice(0,12).map(i=>`<div class="li"><div><b>${R(i.a)}</b> · ${S.st[i.s.s].n}<small>${i.k+1}/${i.s.n} · vence ${dt(i.due)} ${i.late?'<span class="bad">· atrasada</span>':''}</small></div><button class="btn s" onclick="pay(${i.si},${i.k})">Pagar PIX</button></div>`).join(''):'<p style="color:var(--mut)">Nenhuma parcela em aberto.</p>'}</div>`}
function pay(si,k){const s=S.sa[si],i=ins(s)[k];s.p[k]=true;S.cl[s.c].sc=Math.min(900,S.cl[s.c].sc+(i.late?3:8));save();toast('PIX confirmado (simulação). Score atualizado.');draw()}
function vL(){if(!S.st.length||!S.cl.length)return emp('lojas e clientes');const st=S.st[lj],k=ss(lj),ls=[];S.sa.forEach((s,si)=>{if(s.s===lj)ins(s).forEach(i=>{if(i.late)ls.push({...i,s})})});ls.sort((a,b)=>a.due-b.due);
 return`<div class="panel"><label>Loja (demonstração)</label><select onchange="lj=+this.value;draw()">${S.st.map((x,i)=>`<option value="${i}"${i===lj?' selected':''}>${x.n} · ${x.c}</option>`).join('')}</select></div>
 <div class="row"><div class="k"><span>A receber</span><div class="big">${R(k.rec)}</div></div><div class="k"><span>Em atraso</span><div class="big bad">${R(k.atr)}</div></div><div class="k"><span>Vendas no carnê</span><div class="big">${k.v}</div></div></div>
 <div class="two"><div class="panel"><h3>Nova venda no carnê</h3><label>Cliente</label><select id="vc">${S.cl.map((x,i)=>{const a=cs(i).av;return`<option value="${i}">${x.n} · limite ${R(a)}</option>`}).join('')}</select><label>Valor total (R$)</label><input id="vt" type="number" min="10" step="10" value="300"><label>Parcelas (sem juros)</label><select id="vn">${[1,2,3,4,5,6,8,10].map(n=>`<option>${n}</option>`).join('')}</select><p style="margin:12px 0"><button class="btn" onclick="sell()">Registrar venda</button></p></div>
 <div class="panel"><h3>Cobrar hoje (${ls.length})</h3>${ls.length?ls.slice(0,8).map(i=>{const c=S.cl[i.s.c],m=encodeURIComponent(`Olá ${c.n.split(' ')[0]}, a parcela ${i.k+1}/${i.s.n} de ${R(i.a)} da ${st.n} venceu em ${dt(i.due)}. Pague por PIX e mantenha seu limite no Cartão Chevalier.`);return`<div class="li"><div><b>${c.n}</b><small>${R(i.a)} · venceu ${dt(i.due)}</small></div><a class="btn s g" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${wn(c.tel)}?text=${m}">WhatsApp</a></div>`}).join(''):'<p style="color:var(--mut)">Nenhuma parcela atrasada.</p>'}</div></div>`}
function sell(){const c=+$('#vc').value,t=+$('#vt').value,n=+$('#vn').value;if(!(t>=10))return toast('Informe um valor válido');const k=cs(c);if(t>k.av)return toast(`Acima do limite: disponível ${R(k.av)}`);
 S.sa.push({s:lj,c,t,n,d:Date.now(),p:Array(n).fill(false)});save();toast(`Venda registrada: ${n}x de ${R(t/n)}`);draw()}
function vR(){let T=0,A=0,V=0,N=S.sa.length;const rows=S.st.map((s,i)=>{const k=ss(i);T+=k.rec;A+=k.atr;V+=k.tot;return{...s,...k,i}});
 const rec=S.st.length*200+V*.015,f=rows.filter(r=>(r.n+r.c).toLowerCase().includes(q)).sort((a,b)=>b.atr-a.atr);
 return`<div class="row"><div class="k"><span>Lojas na rede</span><div class="big">${S.st.length}</div></div><div class="k"><span>Clientes com cartão</span><div class="big">${S.cl.length}</div></div><div class="k"><span>Volume financiado</span><div class="big">${R(V)}</div></div><div class="k"><span>A receber</span><div class="big">${R(T)}</div></div><div class="k"><span>Em atraso</span><div class="big bad">${R(A)}</div><span>${(A/Math.max(1,T)*100).toFixed(1)}% do a receber</span></div><div class="k"><span>Receita estimada da plataforma</span><div class="big ok">${R(rec)}</div><span>50 × R$ 200 + 1,5% do volume</span></div></div>
 <div class="panel"><h3>Lojas da rede</h3><input placeholder="Buscar loja ou categoria" value="${q}" oninput="q=this.value.toLowerCase();draw(1)" id="qs"><div class="tw" style="margin-top:10px"><table><tr><th>Loja</th><th>Categoria</th><th>Vendas</th><th>A receber</th><th>Atraso</th><th></th></tr>${f.map(r=>{const p=r.atr/Math.max(1,r.rec)*100;return`<tr><td>${r.n}</td><td>${r.c}</td><td>${r.v}</td><td>${R(r.rec)}</td><td>${R(r.atr)}</td><td><span class="tag${p>8?' b':''}">${p>8?'Atenção':'Saudável'}</span></td></tr>`}).join('')}</table></div></div>
 <p class="note">Dados de demonstração gerados no navegador. Para operar de verdade, o próximo passo é ligar banco de dados, login e cobrança PIX real.</p>`}
function vA(){const x=(t,i)=>pend===t+i?`<button class="btn s" style="background:var(--bad)" onclick="del('${t}',${i})">Confirmar?</button>`:`<button class="btn s o" onclick="del('${t}',${i})">Excluir</button>`;
 return`<div class="two"><div class="panel"><h3>Cadastrar cliente</h3><label>Nome completo</label><input id="cn" placeholder="Ex.: Maria da Silva"><label>WhatsApp com DDD</label><input id="ct" type="tel" placeholder="(75) 99999-9999"><label>Limite inicial (R$)</label><input id="cl" type="number" min="50" step="50" value="500"><p style="margin-top:12px"><button class="btn" onclick="addC()">Cadastrar cliente</button></p></div>
 <div class="panel"><h3>Cadastrar loja</h3><label>Nome da loja</label><input id="sn" placeholder="Ex.: Casa do Bolo"><label>Categoria</label><input id="sc" placeholder="Ex.: Confeitaria"><p style="margin-top:12px"><button class="btn" onclick="addS()">Cadastrar loja</button></p></div></div>
 <div class="panel"><h3>Clientes (${S.cl.length})</h3><div class="tw" style="max-height:320px;overflow-y:auto"><table><tr><th>Nome</th><th>WhatsApp</th><th>Limite base</th><th></th></tr>${S.cl.map((c,i)=>`<tr><td>${c.n}</td><td>${c.tel||'-'}</td><td><input type="number" style="width:110px" value="${c.l}" onchange="lim(${i},this.value)"></td><td>${x('c',i)}</td></tr>`).join('')}</table></div></div>
 <div class="panel"><h3>Lojas (${S.st.length})</h3><div class="tw" style="max-height:320px;overflow-y:auto"><table><tr><th>Loja</th><th>Categoria</th><th></th></tr>${S.st.map((c,i)=>`<tr><td>${c.n}</td><td>${c.c}</td><td>${x('s',i)}</td></tr>`).join('')}</table></div></div>
 <div class="panel"><h3>Começar com seus dados reais</h3><p style="color:var(--mut);margin-bottom:10px">Apaga as lojas, clientes e vendas de demonstração para você cadastrar os nomes verdadeiros.</p>${pend==='z'?'<button class="btn" style="background:var(--bad)" onclick="zero()">Confirmar: apagar tudo</button>':'<button class="btn o" onclick="zero()">Zerar demonstração</button>'}</div>`}
function addC(){const n=$('#cn').value.trim(),l=+$('#cl').value;if(n.length<3)return toast('Digite o nome completo');if(!(l>=50))return toast('Informe o limite inicial');const g=()=>Math.floor(1000+Math.random()*9000);S.cl.push({n,tel:$('#ct').value.trim(),l,sc:600,rk:0,no:g()+' '+g()});save();toast('Cliente cadastrado: '+n);draw()}
function addS(){const n=$('#sn').value.trim();if(n.length<2)return toast('Digite o nome da loja');S.st.push({n,c:$('#sc').value.trim()||'Comércio'});save();toast('Loja cadastrada: '+n);draw()}
function lim(i,v){v=+v;if(v>=50){S.cl[i].l=v;save();toast('Limite atualizado')}else toast('Limite mínimo: R$ 50')}
function del(t,i){if(pend!==t+i){pend=t+i;return draw()}pend='';if(t==='c'){S.sa=S.sa.filter(z=>z.c!==i);S.sa.forEach(z=>{if(z.c>i)z.c--});S.cl.splice(i,1);cu=0}else{S.sa=S.sa.filter(z=>z.s!==i);S.sa.forEach(z=>{if(z.s>i)z.s--});S.st.splice(i,1);lj=0}save();toast('Removido');draw()}
function zero(){if(pend!=='z'){pend='z';return draw()}pend='';S={st:[],cl:[],sa:[]};cu=lj=0;save();toast('Dados zerados. Cadastre suas lojas e clientes.');draw()}
function draw(keep){$('#m').innerHTML=view==='c'?vC():view==='l'?vL():view==='a'?vA():vR();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));if(keep){const e=$('#qs');e.focus();e.setSelectionRange(q.length,q.length)}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;pend='';draw();scrollTo(0,0)});
load();draw();
</script>
</body>
</html>
